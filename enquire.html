<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Tell Alleyne Automotive what vehicle you are looking for.">
  <title>Make an Enquiry | Alleyne Automotive</title>
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-v2.png?v=2">\n  <link rel="shortcut icon" href="assets/favicon-v2.png?v=2">\n  <link rel="apple-touch-icon" href="assets/favicon-v2.png?v=2">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="index.html" aria-label="Alleyne Automotive home">
        <img class="brand-mark" src="assets/brand-mark.png" alt="Alleyne Automotive">
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-wordmark">
          <strong>ALLEYNE</strong>
          <small>AUTOMOTIVE</small>
        </span>
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="index.html#sourcing">Sourcing</a>
        <a href="index.html#what-we-source">What We Source</a>
        <a class="active" href="enquire.html">Contact</a>
      </nav>

      <a class="enquire-outline" href="#enquiry-form">
        <span class="enquire-icon" aria-hidden="true">◔</span>
        Enquire
      </a>

      <button class="menu-button" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open navigation">
        <span></span><span></span><span></span>
      </button>
    </div>

    <nav class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation" hidden>
      <a href="index.html">Home</a>
      <a href="index.html#sourcing">Sourcing</a>
      <a href="index.html#what-we-source">What We Source</a>
      <a href="enquire.html">Contact</a>
    </nav>
  </header>

  <main class="enquiry-main">
    <section class="enquiry-section">
      <div class="shell enquiry-layout">
        <div class="enquiry-copy">
          <p class="section-kicker">Alleyne Automotive <span></span></p>
          <h1>Make an enquiry</h1>
          <p>Tell us what you're looking for and we'll start with your brief.</p>

          <div class="mini-process">
            <span>Find</span>
            <span>Source</span>
            <span>You choose</span>
          </div>
        </div>

        <div class="form-card" id="enquiry-form">
          <form novalidate>
            <div class="form-row two">
              <label>
                <span>Full name</span>
                <input type="text" name="name" placeholder="Full Name*" autocomplete="name" required>
              </label>
              <label>
                <span>Phone number</span>
                <input type="tel" name="phone" placeholder="Phone Number*" autocomplete="tel" required>
              </label>
            </div>

            <label>
              <span>Email address</span>
              <input type="email" name="email" placeholder="Email Address*" autocomplete="email" required>
            </label>

            <label>
              <span>Preferred vehicle</span>
              <input type="text" name="vehicle" placeholder="Preferred Vehicle (Make & Model)*" required>
            </label>

            <div class="form-row two">
              <label>
                <span>Budget</span>
                <select name="budget">
                  <option value="">Budget</option>
                  <option>Under £10,000</option>
                  <option>£10,000–£20,000</option>
                  <option>£20,000–£35,000</option>
                  <option>£35,000–£50,000</option>
                  <option>£50,000+</option>
                </select>
              </label>

              <label>
                <span>Year</span>
                <select name="year">
                  <option value="">Year (Optional)</option>
                  <option>2024 or newer</option>
                  <option>2020 or newer</option>
                  <option>2015 or newer</option>
                  <option>No preference</option>
                </select>
              </label>
            </div>

            <label>
              <span>Additional details</span>
              <textarea name="details" rows="6" placeholder="Additional Details (Specification, Colour, etc.)"></textarea>
            </label>

            <button class="gold-button form-submit" type="submit">Submit enquiry <span aria-hidden="true">→</span></button>
            <p class="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
